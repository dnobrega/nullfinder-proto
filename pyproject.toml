[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nullfinder-proto"
version = "0.1.0"
description = "A parallel Python toolkit to find and classify magnetic null points in MHD simulations on Cartesian (uniform or stretched) grids."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Nóbrega-Siverio", email = "dnobregasiverio@cea.fr" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "numba>=0.57",
]
keywords = ["MHD", "magnetic null", "magnetic reconnection", "solar physics", "topology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/dnobrega/nullfinder-proto"
Issues = "https://github.com/dnobrega/nullfinder-proto/issues"

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.6"]
benchmark = ["matplotlib", "pandas", "jupyterlab"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "RUF", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["nullfinder_proto"]
